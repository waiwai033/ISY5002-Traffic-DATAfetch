name: Collect eight traffic cameras

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'chain = long self-renewing window; sample = one cycle; batch = bounded run; trial = one cycle outside the dataset'
        type: choice
        options: [chain, sample, batch, trial]
        default: chain
        required: true
      duration_minutes:
        description: 'batch mode only: minutes to keep collecting (1-55)'
        default: '55'
        required: false
  schedule:
    # Watchdog only; this never collects. GitHub delivered 3 of roughly 42 ticks here
    # over seven hours, so cron is far too lossy to drive collection. A tick that does
    # land just checks the chain is alive and restarts it if it is not.
    - cron: '1,11,21,31,41,51 * * * *'

permissions:
  contents: read
  actions: write

jobs:
  # A scheduled tick must never queue behind the chain: it would sit pending for hours
  # and then start ahead of the chain's own hand-over. It gets its own group, checks in
  # a few seconds, and exits.
  watchdog:
    if: github.event_name == 'schedule' && vars.COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: traffic-watchdog
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Restart the chain only if it has stopped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LAUNCH_LEAD_MINUTES: ${{ vars.LAUNCH_LEAD_MINUTES || '300' }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from run_collection_week import load_plan
          plan, start, end, _ = load_plan(Path('reference/collection_week.json'))
          now = datetime.now(timezone.utc)
          listing = subprocess.run(
              ['gh', 'run', 'list', '--workflow', 'collect.yml', '--limit', '40',
               '--json', 'databaseId,status'],
              capture_output=True, text=True, check=True).stdout
          mine = int(os.environ['RUN_ID'])
          busy = {'in_progress', 'queued', 'pending', 'waiting', 'requested'}
          alive = [r for r in json.loads(listing)
                   if r['databaseId'] != mine and r['status'] in busy]
          # A worker may be launched before the window opens: it idles until start_at
          # so collection begins on the minute instead of whenever a tick lands.
          lead = float(os.environ.get('LAUNCH_LEAD_MINUTES', '300'))
          ahead = (start - now).total_seconds() / 60
          if now >= end:
              verdict = 'The campaign window has closed; not restarting'
          elif ahead > lead:
              verdict = f'Campaign opens in {ahead:.0f} minutes, beyond the {lead:.0f}-minute lead; waiting'
          elif alive:
              verdict = f'{len(alive)} collection run(s) already alive; nothing to restart'
          else:
              subprocess.run(['gh', 'workflow', 'run', 'collect.yml', '-f', 'mode=chain'], check=True)
              verdict = 'No collection run was alive; restarted the chain'
          print(verdict)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Chain watchdog\n\n{verdict}.\n')
          PY

  collect:
    # Manual one-offs always run; anything that chains needs the kill switch on, so
    # clearing COLLECTION_ENABLED stops the chain at its next link.
    if: github.event_name == 'workflow_dispatch' && (inputs.mode != 'chain' || vars.COLLECTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      # Chain links share one group so two chains can never run at once. Manual
      # one-offs get their own group and never queue behind a five-hour window.
      group: traffic-${{ inputs.mode == 'chain' && 'chain' || format('manual-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate campaign window
        id: window
        env:
          MODE: ${{ inputs.mode }}
          DURATION: ${{ inputs.duration_minutes || '55' }}
          CHAIN_MINUTES: ${{ vars.CHAIN_BATCH_MINUTES || '340' }}
          JOB_BUDGET_MINUTES: '340'
        run: |
          python - <<'PY'
          import os, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from run_collection_week import TRIAL_DIR, load_plan
          plan, start, end, cameras = load_plan(Path('reference/collection_week.json'))
          now = datetime.now(timezone.utc)
          mode = os.environ['MODE']
          minutes = 0.0
          wait = max(0.0, (start - now).total_seconds() / 60)
          if mode in ('chain', 'batch'):
              limit = 350 if mode == 'chain' else 55
              minutes = float(os.environ['CHAIN_MINUTES'] if mode == 'chain' else os.environ['DURATION'])
              if not 0 < minutes <= limit:
                  raise SystemExit(f'{mode} duration must be between 1 and {limit} minutes')
              # Idling before the window opens spends the same job budget as collecting,
              # so the two together have to fit or the runner is killed mid-batch.
              budget = float(os.environ['JOB_BUDGET_MINUTES'])
              minutes = min(minutes, budget - wait, (end - max(now, start)).total_seconds() / 60)
          run = now < end and (mode == 'trial' or mode == 'sample' and start <= now
                               or mode in ('chain', 'batch') and minutes > 0)
          path = TRIAL_DIR if mode == 'trial' else plan['output_dir']
          label = {'chain': 'Self-renewing collection window', 'sample': 'Single ten-minute sample',
                   'batch': 'Bounded catch-up batch', 'trial': 'One-round trial'}[mode]
          status = 'Starting' if run else 'Skipped: outside campaign window'
          print(f'{status}: {label}; duration={minutes:.2f} minutes; output={path}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## {label}\n\n{status}. Output: `{path}`.\n\n')
              if minutes:
                  summary.write(f'Duration limit: {minutes:.2f} minutes.\n\n')
              if now >= end:
                  summary.write('**The campaign window has closed.** Set the repository variable '
                                '`COLLECTION_ENABLED` to `false` so the watchdog stops restarting it.\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'run={str(run).lower()}\nmode={mode}\nminutes={minutes}\npath={path}\n')
              stream.write(f'wait={wait}\nweek={Path(plan["output_dir"]).name}\n')
              stream.write(f'started={time.time()}\n')
          PY
      - name: Collect images and manifest
        if: steps.window.outputs.run == 'true'
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
          MODE: ${{ steps.window.outputs.mode }}
          MINUTES: ${{ steps.window.outputs.minutes }}
          WAIT: ${{ steps.window.outputs.wait }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          mode = os.environ['MODE']
          command = [sys.executable, 'scripts/run_collection_week.py']
          command += {'sample': ['--sample'], 'trial': ['--once']}.get(
              mode, ['--max-runtime-minutes', os.environ['MINUTES'],
                     '--max-wait-minutes', os.environ['WAIT']])
          subprocess.run(command, check=True)
          PY
      - name: Preserve images and metadata
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: traffic-${{ steps.window.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.window.outputs.path }}/images/
            ${{ steps.window.outputs.path }}/metadata/
            ${{ steps.window.outputs.path }}/manifest.csv
            ${{ steps.window.outputs.path }}/state.json
          if-no-files-found: warn
          retention-days: 90
      - name: Hand over to the next collection window
        # Runs even when collection failed, so one bad window does not end the campaign.
        if: always() && steps.window.outputs.mode == 'chain' && steps.window.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STARTED: ${{ steps.window.outputs.started }}
        run: |
          python - <<'PY'
          import os, subprocess, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from run_collection_week import load_plan
          plan, start, end, _ = load_plan(Path('reference/collection_week.json'))
          now = datetime.now(timezone.utc)
          elapsed = (time.time() - float(os.environ['STARTED'])) / 60
          # A window that died young would otherwise hand over immediately and spin.
          # Below the floor the chain stops and the watchdog is left to restart it.
          if now >= end:
              reason = 'the campaign window has closed'
          elif elapsed < 30:
              reason = f'this window lasted only {elapsed:.1f} minutes, below the 30-minute floor'
          else:
              reason = None
          if reason:
              print(f'Not handing over: {reason}')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'\nNo hand-over: {reason}.\n')
              raise SystemExit(0)
          subprocess.run(['gh', 'workflow', 'run', 'collect.yml', '-f', 'mode=chain'], check=True)
          print(f'Handed over after {elapsed:.1f} minutes; next window dispatched')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\nHanded over to the next window after {elapsed:.1f} minutes.\n')
          PY
